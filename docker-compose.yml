services:
  sales-agent:
    build: .
    container_name: telegram_sales_agent
    restart: unless-stopped
    env_file:
      - .env
    stop_grace_period: 30s   # даём graceful shutdown (SIGTERM -> pool.stop_all()) время отработать
    dns:
      # Явный публичный DNS вместо унаследованного от хоста — на машине
      # разработки локальный прокси (Koala Clash) подменяет резолв в
      # fake-ip (198.18.0.0/16) для перехвата трафика в браузере, но не
      # перехватывает не-браузерные соединения (Docker/WSL2), из-за чего
      # они просто зависают на ConnectTimeout к нерабочему fake-ip.
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      # Telethon-сессии — стейт, создаётся ЛОКАЛЬНО через create_session.py
      # (см. README.md), потом только читается/обновляется контейнером.
      - ./sessions:/app/sessions
      - ./sales_agent.db:/app/sales_agent.db
      - ./kb_index.json:/app/kb_index.json

      # Google Sheets в проде: положите service_account.json рядом с этим
      # файлом и раскомментируйте строку ниже.
      # - ./service_account.json:/app/service_account.json:ro

      # Локальный тест без Google Sheets (LocalSheet, см. main.py):
      # - ./profiles_local.json:/app/profiles_local.json
