services:
  bot:
    build: .
    restart: always
    env_file:
      - .env
    ports:
      # Публикуем только на адрес WireGuard-туннеля до RU-сервера: Docker сам
      # прописывает DNAT в обход ufw, поэтому единственный надёжный способ не
      # светить порт наружу — не биндить его на 0.0.0.0 вообще.
      - "10.66.6.2:8081:8081"
